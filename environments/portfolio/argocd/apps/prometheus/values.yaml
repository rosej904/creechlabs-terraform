server:
  extraArgs:
    web.enable-remote-write-receiver: ""

  persistentVolume:
    enabled: true
    storageClass: gp3
    size: 5Gi

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

serverFiles:
  recording_rules.yml:
    groups:
      - name: slo_success_rate
        rules:
          - record: service:requests:rate5m
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[5m]))
          - record: service:requests_failed:rate5m
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service=~"checkout|recommendation|frontend|productcatalog"}[5m]))
          - record: service:requests:rate1h
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[1h]))
          - record: service:requests_failed:rate1h
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service=~"checkout|recommendation|frontend|productcatalog"}[1h]))
          - record: service:requests:rate30m
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[30m]))
          - record: service:requests_failed:rate30m
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service=~"checkout|recommendation|frontend|productcatalog"}[30m]))
          - record: service:requests:rate3h
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[3h]))
          - record: service:requests_failed:rate3h
            expr: sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service=~"checkout|recommendation|frontend|productcatalog"}[3h]))

          - record: service:burnrate5m
            expr: (service:requests_failed:rate5m / service:requests:rate5m) / 0.01
          - record: service:burnrate1h
            expr: (service:requests_failed:rate1h / service:requests:rate1h) / 0.01
          - record: service:burnrate30m
            expr: (service:requests_failed:rate30m / service:requests:rate30m) / 0.01
          - record: service:burnrate3h
            expr: (service:requests_failed:rate3h / service:requests:rate3h) / 0.01

      - name: slo_latency
        rules:
          - record: service:latency_p95:5m
            expr: |
              histogram_quantile(0.95,
                sum by (service, le) (
                  rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[5m])
                )
              )
          - record: service:latency_p99:5m
            expr: |
              histogram_quantile(0.99,
                sum by (service, le) (
                  rate(traces_spanmetrics_latency_bucket{span_kind="SPAN_KIND_SERVER", service=~"checkout|recommendation|frontend|productcatalog"}[5m])
                )
              )

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true

kubelet:
  enabled: true

kubeProxy:
  enabled: true