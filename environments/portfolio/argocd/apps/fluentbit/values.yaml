config:
  filters: |
    [FILTER]
        Name                  multiline
        Match                 kube.*
        Multiline.Key_Content log
        Multiline.Parser      go, java, python

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

  outputs: |
    [OUTPUT]
        Name        loki
        Match       *
        Host        loki.observability.svc.cluster.local
        Port        3100
        Labels      job=fluent-bit
        Auto_Kubernetes_Labels on
        Label_Keys  $kubernetes['namespace_name'], $kubernetes['pod_name'], $stream
        line_format json
        log_level   info

testFramework:
  enabled: false

rbac:
  create: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi