fullnameOverride: mimir

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::445606683808:role/cl-portfolio-mimir-irsa"

# Straight to S3 for lite fotprint
minio:
  enabled: false

kafka:
  enabled: false

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false

querier:
  replicas: 1

query_scheduler:
  replicas: 1

mimir:
  structuredConfig:
    multitenancy_enabled: false

    # Explicitly opt out of the new Kafka-backed ingest storage path and
    # stay on the classic architecture (ingesters write blocks directly).
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true

      # With only 1 ingester (see above), replication_factor: 3 (the
      # chart default) would make writes wait on quorum from ingesters
      # that don't exist and never succeed. Set to 1 to match.
      ring:
        replication_factor: 1

    common:
      storage:
        backend: s3
        s3:
          region: us-east-1
          endpoint: s3.us-east-1.amazonaws.com
          # No access_key_id / secret_access_key — auth is handled by
          # IRSA via the service account annotation above. The AWS SDK
          # inside Mimir picks up credentials automatically

    blocks_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: blocks
    alertmanager_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: alertmanager
    ruler_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: ruler

    limits:
      compactor_blocks_retention_period: 30d

      # Demo-scale ceiling, well above what a portfolio cluster will
      # ever push — just guards against a runaway scrape config eating
      # memory unbounded. Raise if you hit the limit legitimately.
      max_global_series_per_user: 200000
      max_label_names_per_series: 45

# NOT YET SET: per-component disk (ingester.persistentVolume.size,
# store_gateway.persistentVolume.size, etc.) and per-component resources
# (ingester.resources, distributor.resources, ...) — the chart has no
# global top-level key for either, each component defines its own block.
# Chart defaults are reasonable to start (e.g. ingester PV defaults to
# 2Gi) — worth a follow-up pass once you see it running, rather than me
# guessing sizes for every component right now. Same applies to AZ
# pinning: ingester/store_gateway.affinity or .nodeSelector, per
# component, if the single private subnet doesn't already make it moot.
