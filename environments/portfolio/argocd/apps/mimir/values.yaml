# mimir-distributed 6.1.0 values — classic architecture (no Kafka), zone
# awareness disabled, single replica per component.
#
# CORRECTION: there is no real "monolithic" mode in the official chart —
# `deploymentMode: monolithic` (used in a prior version of this file) came
# from an unmerged community PR, and Helm silently ignored the unknown key.
# This is the closest real equivalent: microservices mode, but with
# zone-aware replication turned off and every replica count set to 1, so
# you get one pod per component instead of 3x zone-replicated StatefulSets
# for ingester/store-gateway. Chart 6.0+ also defaults to Kafka-backed
# ingest storage, which stays disabled below.

# Makes the release name predictable ("mimir") so the K8s service account
# name is deterministic — this MUST match the "sub" claim in the IRSA
# trust policy on the mimir_irsa role (system:serviceaccount:observability:mimir).
fullnameOverride: mimir

serviceAccount:
  create: true
  annotations:
    # Fill in with the actual ARN of aws_iam_role.mimir_irsa from eks-infra.
    eks.amazonaws.com/role-arn: "<mimir-irsa-role-arn>"

# The chart bundles demo-only MinIO and Kafka deployments for quickstart
# use. We're using real S3 and classic architecture, so both are unneeded
# — leaving either enabled would spin up extra StatefulSets you don't want.
minio:
  enabled: false

kafka:
  enabled: false

# Collapses ingester from 3x zone-replicated StatefulSets down to one.
ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false

# Same collapse for store-gateway.
store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false

mimir:
  structuredConfig:
    # No multi-tenancy needed for a single-source (Prometheus remote_write)
    # setup — avoids having to send an X-Scope-OrgID header.
    multitenancy_enabled: false

    # Explicitly opt out of the new Kafka-backed ingest storage path and
    # stay on the classic architecture (ingesters write blocks directly).
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true

      # With only 1 ingester (see above), replication_factor: 3 (the
      # chart default) would make writes wait on quorum from ingesters
      # that don't exist and never succeed. Set to 1 to match.
      ring:
        replication_factor: 1

    common:
      storage:
        backend: s3
        s3:
          region: us-east-1
          endpoint: s3.us-east-1.amazonaws.com
          # No access_key_id / secret_access_key — auth is handled by
          # IRSA via the service account annotation above. The AWS SDK
          # inside Mimir picks up credentials automatically; putting
          # static keys here would be both unnecessary and a step backward.

    # All three storage types share the one bucket from mimir-storage —
    # no new buckets needed. Mimir requires each to use a distinct prefix
    # within a shared bucket, or it refuses to start (they'd otherwise
    # collide at the same object paths).
    blocks_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: blocks
    alertmanager_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: alertmanager
    ruler_storage:
      s3:
        bucket_name: cl-portfolio-mimir-blocks-445606683808
      storage_prefix: ruler

    limits:
      # 30-day retention, enforced by the compactor.
      compactor_blocks_retention_period: 30d

      # Demo-scale ceiling, well above what a portfolio cluster will
      # ever push — just guards against a runaway scrape config eating
      # memory unbounded. Raise if you hit the limit legitimately.
      max_global_series_per_user: 200000

# NOT YET SET: per-component disk (ingester.persistentVolume.size,
# store_gateway.persistentVolume.size, etc.) and per-component resources
# (ingester.resources, distributor.resources, ...) — the chart has no
# global top-level key for either, each component defines its own block.
# Chart defaults are reasonable to start (e.g. ingester PV defaults to
# 2Gi) — worth a follow-up pass once you see it running, rather than me
# guessing sizes for every component right now. Same applies to AZ
# pinning: ingester/store_gateway.affinity or .nodeSelector, per
# component, if the single private subnet doesn't already make it moot.
