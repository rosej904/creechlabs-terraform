admin:
  existingSecret: "grafana-admin-credentials"
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: false

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:445606683808:certificate/bced14e9-9cc5-49f1-b1fa-f762b4de535a"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/group.name: portfolio
  hosts:
    - grafana.creechlabs.dev

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: '$${__value.raw}'

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            filterByTraceID: true
            filterBySpanID: true
            customQuery: false
            tags:
              - key: 'service.name'
                value: 'service_name'
              - key: 'k8s.deployment.name'
                value: 'k8s_deployment_name'
          tracesToMetrics:
            datasourceUid: prometheus
            spanTimer:
              metric: 'traces_spanmetrics_latency_count'
            queries:
            - name: 'Request Duration (Heatmap)'
              query: 'sum(rate(traces_spanmetrics_latency_bucket{service=~"($service|.+)"}[5m])) by (le, service)'
            - name: 'Average Latency'
              query: 'sum(rate(traces_spanmetrics_latency_sum{service=~"($service|.+)"}[5m])) by (service) / sum(rate(traces_spanmetrics_latency_count{service=~"($service|.+)"}[5m])) by (service) * 1000'
            - name: 'Request Rate'
              query: 'sum(rate(traces_spanmetrics_calls_total{service=~"($service|.+)"}[5m])) by (service)'
              
alerting:
  slo_burn_rate_alerts.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: slo_burn_rate_alerts
        folder: SLO Alerts
        interval: 1m
        rules:
          - uid: slo-fast-burn-dynamic
            title: "SLO - Fast Burn (Page)"
            condition: C
            for: 2m
            noDataState: OK
            execErrState: OK
            labels: { severity: page }
            annotations: { summary: "Service error budget burning fast (>14.4x)" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "service:burnrate5m and on(service) slo:member:errorbudget", refId: A }
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange: { from: 3600, to: 0 }
                model: { expr: "service:burnrate1h and on(service) slo:member:errorbudget", refId: B }
              - refId: C
                datasourceUid: __expr__
                model: { type: math, expression: "$A > 14.4 && $B > 14.4", refId: C }

          - uid: slo-slow-burn-dynamic
            title: "SLO - Slow Burn (Ticket)"
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket }
            annotations: { summary: "Service error budget burning slowly (>6x)" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 1800, to: 0 }
                model: { expr: "service:burnrate30m and on(service) slo:member:errorbudget", refId: A }
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange: { from: 10800, to: 0 }
                model: { expr: "service:burnrate3h and on(service) slo:member:errorbudget", refId: B }
              - refId: C
                datasourceUid: __expr__
                model: { type: math, expression: "$A > 6 && $B > 6", refId: C }

          - uid: slo-latency-p95-dynamic
            title: "SLO - p95 Latency Breach"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket }
            annotations: { summary: "Service p95 latency above 500ms SLO target" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "service:latency_p95:5m and on(service) slo:member:latency_p95", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.5] } }], refId: B }

  resource_alerts.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: app_resource_alerts
        folder: Resource Alerts
        interval: 1m
        rules:
          - uid: app-high-cpu-usage-dynamic
            title: "App - High CPU Usage vs Limit"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: app }
            annotations: { summary: "Pod CPU usage above 85% of its limit" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"otel-demo\", container!=\"\"}[5m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"otel-demo\", resource=\"cpu\"}) * 100) and on(pod) kube_pod_labels{namespace=\"otel-demo\", label_pod_health=\"true\"}", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [85] } }], refId: B }

          - uid: app-high-memory-usage-dynamic
            title: "App - High Memory Usage vs Limit"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: app }
            annotations: { summary: "Pod memory usage above 85% of its limit (OOM risk)" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "(sum by (pod) (container_memory_working_set_bytes{namespace=\"otel-demo\", container!=\"\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"otel-demo\", resource=\"memory\"}) * 100) and on(pod) kube_pod_labels{namespace=\"otel-demo\", label_pod_health=\"true\"}", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [85] } }], refId: B }

          - uid: app-pod-restart-loop-dynamic
            title: "App - Pod Restart Loop"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: page, scope: app }
            annotations: { summary: "Pod restarting repeatedly (CrashLoopBackOff signal)" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 900, to: 0 }
                model: { expr: "increase(kube_pod_container_status_restarts_total{namespace=\"otel-demo\"}[15m]) and on(pod) kube_pod_labels{namespace=\"otel-demo\", label_pod_health=\"true\"}", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [2] } }], refId: B }

          - uid: app-pod-not-running-dynamic
            title: "App - Pod Not Running"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: page, scope: app }
            annotations: { summary: "Pod stuck outside Running phase" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "kube_pod_status_phase{namespace=\"otel-demo\", phase!~\"Running|Succeeded\"} and on(pod) kube_pod_labels{namespace=\"otel-demo\", label_pod_health=\"true\"}", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: B }

      - orgId: 1
        name: infra_resource_alerts
        folder: Resource Alerts
        interval: 1m
        rules:
          - uid: infra-node-high-cpu
            title: "Infra - Node High CPU"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: infra }
            annotations: { summary: "EKS node CPU usage above 80%" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [80] } }], refId: B }

          - uid: infra-node-high-memory
            title: "Infra - Node High Memory"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: infra }
            annotations: { summary: "EKS node memory usage above 80%" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [80] } }], refId: B }

          - uid: infra-node-high-disk
            title: "Infra - Node High Disk Usage"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: infra }
            annotations: { summary: "EKS node root filesystem usage above 80%" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"})) * 100", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [80] } }], refId: B }

          - uid: infra-node-not-ready
            title: "Infra - Node Not Ready"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: page, scope: infra }
            annotations: { summary: "EKS node reporting NotReady condition" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 0)", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: B }
  
  app_policy_alerts.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: app_policy_alerts
        folder: Policy Alerts
        interval: 5m
        rules:
          - uid: policy-missing-cpu-limit
            title: "Policy - Containers Missing CPU Limit"
            condition: B
            for: 10m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: policy }
            annotations: { summary: "One or more containers have no CPU limit defined" }
            data:
              data:
                - refId: A
                  datasourceUid: prometheus
                  relativeTimeRange:
                    from: 300
                    to: 0
                  model:
                    expr: "sum by (deployment) ( label_replace(kube_pod_container_status_running{namespace=\"otel-demo\"} unless on(namespace, pod, container) kube_pod_container_resource_limits{namespace=\"otel-demo\", resource=\"cpu\"}, \"deployment\", \"$1\", \"pod\", \"([a-zA-O0-9-]+?)-[a-z0-9]+-[a-z0-9]+\"))"
                    refId: A

                - refId: B
                  datasourceUid: __expr__
                  model:
                    type: reduce
                    expression: A
                    reducer: last
                    settings:
                      mode: strict
                    refId: B

                - refId: C
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator:
                          type: gt
                          params: [0]
                    refId: C


          - uid: policy-missing-cpu-request
            title: "Policy - Containers Missing CPU Request"
            condition: B
            for: 10m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: policy }
            annotations: { summary: "One or more containers have no CPU request defined" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "sum by (deployment) (  label_replace(kube_pod_container_status_running{namespace=\"otel-demo\"} unless on(namespace, pod, container) kube_pod_container_resource_requests{namespace=\"otel-demo\", resource=\"cpu\"}, \"deployment\", \"$1\", \"pod\", \"([a-zA-O0-9-]+?)-[a-z0-9]+-[a-z0-9]+\"))", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: B }

          - uid: policy-missing-memory-limit
            title: "Policy - Containers Missing Memory Limit"
            condition: B
            for: 10m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: policy }
            annotations: { summary: "One or more containers have no memory limit defined" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "sum by (deployment) (  label_replace(kube_pod_container_status_running{namespace=\"otel-demo\"} unless on(namespace, pod, container) kube_pod_container_resource_limits{namespace=\"otel-demo\", resource=\"memory\"}, \"deployment\", \"$1\", \"pod\", \"([a-zA-O0-9-]+?)-[a-z0-9]+-[a-z0-9]+\"))", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: B }

          - uid: policy-missing-memory-request
            title: "Policy - Containers Missing Memory Request"
            condition: B
            for: 10m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, scope: policy }
            annotations: { summary: "One or more containers have no memory request defined" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "sum by (deployment) (  label_replace(kube_pod_container_status_running{namespace=\"otel-demo\"} unless on(namespace, pod, container) kube_pod_container_resource_requests{namespace=\"otel-demo\", resource=\"memory\"}, \"deployment\", \"$1\", \"pod\", \"([a-zA-O0-9-]+?)-[a-z0-9]+-[a-z0-9]+\"))", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: B }

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
