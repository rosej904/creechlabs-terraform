admin:
  existingSecret: "grafana-admin-credentials"
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: false

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:445606683808:certificate/bced14e9-9cc5-49f1-b1fa-f762b4de535a"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/group.name: portfolio
  hosts:
    - grafana.creechlabs.dev

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              url: 'traceId = "${__value.raw}"'
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            filterByTraceID: true
            filterBySpanID: true
            customQuery: false
            tags:
              - key: 'service.name'
                value: 'service_name'
              - key: 'k8s.deployment.name'
                value: 'k8s_deployment_name'
          tracesToMetrics:
            datasourceUid: prometheus
            spanTimer:
              metric: 'http_server_request_duration_seconds_count'
            queries:
            - name: 'Request Duration (Heatmap)'
              query: 'sum(rate(http_server_request_duration_seconds_bucket{service_name=~"($service_name|.+)"}[5m])) by (le, service_name)'
            - name: 'Average Latency'
              query: 'sum(rate(http_server_request_duration_seconds_sum{service_name=~"($service_name|.+)"}[5m])) by (service_name) / sum(rate(http_server_request_duration_seconds_count{service_name=~"($service_name|.+)"}[5m])) by (service_name) * 1000'
              

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
