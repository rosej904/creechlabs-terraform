admin:
  existingSecret: "grafana-admin-credentials"
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: false

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:445606683808:certificate/bced14e9-9cc5-49f1-b1fa-f762b4de535a"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/group.name: portfolio
  hosts:
    - grafana.creechlabs.dev

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: '$${__value.raw}'

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            filterByTraceID: true
            filterBySpanID: true
            customQuery: false
            tags:
              - key: 'service.name'
                value: 'service_name'
              - key: 'k8s.deployment.name'
                value: 'k8s_deployment_name'
          tracesToMetrics:
            datasourceUid: prometheus
            spanTimer:
              metric: 'traces_spanmetrics_latency_count'
            queries:
            - name: 'Request Duration (Heatmap)'
              query: 'sum(rate(traces_spanmetrics_latency_bucket{service=~"($service|.+)"}[5m])) by (le, service)'
            - name: 'Average Latency'
              query: 'sum(rate(traces_spanmetrics_latency_sum{service=~"($service|.+)"}[5m])) by (service) / sum(rate(traces_spanmetrics_latency_count{service=~"($service|.+)"}[5m])) by (service) * 1000'
            - name: 'Request Rate'
              query: 'sum(rate(traces_spanmetrics_calls_total{service=~"($service|.+)"}[5m])) by (service)'
              
alerting:
  slo_burn_rate_alerts.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: slo_burn_rate_alerts
        folder: SLO Alerts
        interval: 1m
        rules:
          # ===== CHECKOUT =====
          - uid: checkout-fast-burn
            title: "Checkout - Fast Burn (Page)"
            condition: C
            for: 2m
            noDataState: OK
            execErrState: OK
            labels: { severity: page, service: checkout }
            annotations: { summary: "Checkout error budget burning fast (>14.4x) - would exhaust 30d budget in ~2 days" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "service:burnrate5m{service=\"checkout\"}", refId: A }
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange: { from: 3600, to: 0 }
                model: { expr: "service:burnrate1h{service=\"checkout\"}", refId: B }
              - refId: C
                datasourceUid: __expr__
                model: { type: math, expression: "$A > 14.4 && $B > 14.4", refId: C }

          - uid: checkout-slow-burn
            title: "Checkout - Slow Burn (Ticket)"
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, service: checkout }
            annotations: { summary: "Checkout error budget burning slowly (>6x) - would exhaust 30d budget in ~5 days" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 1800, to: 0 }
                model: { expr: "service:burnrate30m{service=\"checkout\"}", refId: A }
              - refId: B
                datasourceUid: prometheus
                relativeTimeRange: { from: 10800, to: 0 }
                model: { expr: "service:burnrate3h{service=\"checkout\"}", refId: B }
              - refId: C
                datasourceUid: __expr__
                model: { type: math, expression: "$A > 6 && $B > 6", refId: C }

          - uid: checkout-latency-p95
            title: "Checkout - p95 Latency SLO Breach"
            condition: B
            for: 5m
            noDataState: OK
            execErrState: OK
            labels: { severity: ticket, service: checkout }
            annotations: { summary: "Checkout p95 latency above 500ms SLO target" }
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange: { from: 300, to: 0 }
                model: { expr: "service:latency_p95:5m{service=\"checkout\"}", refId: A }
              - refId: B
                datasourceUid: __expr__
                model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.5] } }], refId: B }

          # ===== RECOMMENDATION =====
