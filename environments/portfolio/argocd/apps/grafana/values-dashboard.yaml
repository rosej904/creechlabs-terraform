              "panel-4": {
                "kind": "Panel",
                "spec": {
                  "id": 4,
                  "title": "K8s Node Disk %",
                  "description": "",
                  "links": [],
                  "data": {
                    "kind": "QueryGroup",
                    "spec": {
                      "queries": [
                        {
                          "kind": "PanelQuery",
                          "spec": {
                            "query": {
                              "kind": "DataQuery",
                              "group": "prometheus",
                              "version": "v0",
                              "datasource": {
                                "name": "prometheus"
                              },
                              "spec": {
                                "editorMode": "code",
                                "exemplar": false,
                                "expr": "(1 - (sum by (device, node) (node_filesystem_avail_bytes{node=~\"$node\", mountpoint=\"/\", fstype!=\"tmpfs\"}) / (sum by (device, node) (node_filesystem_size_bytes{node=~\"$node\", mountpoint=\"/\", fstype!=\"tmpfs\"})))) * 100",
                                "instant": false,
                                "legendFormat": "{{label_name}}",
                                "range": true
                              }
                            },
                            "refId": "A",
                            "hidden": false
                          }
                        }
                      ],
                      "transformations": [],
                      "queryOptions": {}
                    }
                  },
                  "vizConfig": {
                    "kind": "VizConfig",
                    "group": "timeseries",
                    "version": "13.0.1",
                    "spec": {
                      "options": {
                        "annotations": {
                          "clustering": -1,
                          "multiLane": false
                        },
                        "legend": {
                          "calcs": [],
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                        },
                        "tooltip": {
                          "hideZeros": false,
                          "mode": "single",
                          "sort": "none"
                        }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              {
                                "value": 0,
                                "color": "green"
                              },
                              {
                                "value": 60,
                                "color": "#EAB839"
                              },
                              {
                                "value": 90,
                                "color": "red"
                              }
                            ]
                          },
                          "color": {
                            "mode": "thresholds"
                          },
                          "links": [
                            {
                              "oneClick": false,
                              "title": "Filter by ${__field.labels.node}",
                              "url": "/d/${__dashboard.uid}?var-node=${__field.labels.node}"
                            }
                          ],
                          "custom": {
                            "axisBorderShow": false,
                            "axisCenteredZero": false,
                            "axisColorMode": "text",
                            "axisLabel": "",
                            "axisPlacement": "auto",
                            "barAlignment": 0,
                            "barWidthFactor": 0.6,
                            "drawStyle": "line",
                            "fillOpacity": 0,
                            "gradientMode": "none",
                            "hideFrom": {
                              "legend": false,
                              "tooltip": false,
                              "viz": false
                            },
                            "insertNulls": false,
                            "lineInterpolation": "linear",
                            "lineWidth": 1,
                            "pointSize": 5,
                            "scaleDistribution": {
                              "type": "linear"
                            },
                            "showPoints": "auto",
                            "showValues": false,
                            "spanNulls": false,
                            "stacking": {
                              "group": "A",
                              "mode": "none"
                            },
                            "thresholdsStyle": {
                              "mode": "off"
                            }
                          }
                        },
                        "overrides": [
                          {
                            "__systemRef": "hideSeriesFrom",
                            "matcher": {
                              "id": "byNames",
                              "options": {
                                "mode": "exclude",
                                "names": [
                                  "{device=\"/dev/nvme0n1p1\", node=\"ip-10-0-12-22.ec2.internal\"}"
                                ],
                                "prefix": "All except:",
                                "readOnly": true
                              }
                            },
                            "properties": [
                              {
                                "id": "custom.hideFrom",
                                "value": {
                                  "legend": false,
                                  "tooltip": true,
                                  "viz": true
                                }
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }
