version: 0.2

phases:
  install:
    commands:
      # Pin to same version as apply for consistency
      - terraform_version="1.15.4"
      - curl -sLO "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip"
      - unzip -q "terraform_${terraform_version}_linux_amd64.zip"
      - mv terraform /usr/local/bin/
      - terraform version

  pre_build:
    commands:
      - echo "=== Starting Terraform Destroy ==="
      - echo "State bucket - $TF_STATE_BUCKET"
      - echo "Region - $AWS_REGION"
      - aws sts get-caller-identity
      - export TF_VAR_cloudflare_api_token=$CLOUDFLARE_API_TOKEN
      - export TF_VAR_argocd_admin_password=$ARGOCD_ADMIN_PASSWORD
      - export TF_VAR_argocd_repo_ssh_private_key=$ARGOCD_REPO_SSH_PRIVATE_KEY

  build:
    commands:

      # Argo Layer — ArgoCD
      - echo "=== Destroying ArgoCD layer ==="
      - cd environments/portfolio/argocd
      - |
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=environments/portfolio/argocd/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"
      - terraform destroy -auto-approve -input=false
      - cd ../../..

      # EKS-INFRA Layer — EKS Infrastructure
      - echo "=== Destroying EKS Infrastructure layer ==="
      - cd environments/portfolio/eks-infra

      # Delete ingress to trigger LBC to delete ALBs
      - echo "=== Deleting all Ingress resources to release ALBs ==="
      - aws eks update-kubeconfig --region $AWS_REGION --name ${PROJECT_NAME}-cluster
      - kubectl delete ingress --all --all-namespaces --ignore-not-found=true
      - echo "=== Waiting for ALBs to be deleted ==="
      - |
        for i in $(seq 1 30); do
          ALB_COUNT=$(aws elbv2 describe-load-balancers --query "length(LoadBalancers[?contains(LoadBalancerName, '${PROJECT_NAME}')])" --output text)
          if [ "$ALB_COUNT" = "0" ]; then
            echo "All ALBs deleted"
            break
          fi
          echo "Still $ALB_COUNT ALB(s) remaining, waiting..."
          sleep 10
        done

      # Wait for ALBs to actually be deleted - LBC needs time
      - echo "=== Waiting for ALB cleanup ==="
      - sleep 60
      - |
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=environments/portfolio/eks-infra/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"
      - terraform destroy -auto-approve -input=false
      - cd ../../..

      # EKS Layer
      - echo "=== Destroying EKS layer ==="
      - cd environments/portfolio/eks
      - |
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=environments/portfolio/eks/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"
      - terraform destroy -auto-approve -input=false
      - cd ../../..

      # Network Layer
      - echo "=== Destroying networking layer ==="
      - cd environments/portfolio/networking
      - |
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=environments/portfolio/networking/terraform.tfstate" \
          -backend-config="region=$AWS_REGION" \
          -backend-config="use_lockfile=true" \
          -backend-config="encrypt=true"
      - terraform destroy -auto-approve -input=false
      - cd ../../..

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "=== All layers destroyed successfully — cost zeroed out ==="
        else
          echo "=== Destroy failed — manual cleanup may be required ==="
          exit 1
        fi
